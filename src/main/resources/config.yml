# ============================================================
# HaoHan Metallurgy — config.yml
# Mọi giá trị gameplay đều ở đây. Không hardcode trong code.
# ============================================================

config-version: 12

# Ngôn ngữ hiển thị: vi hoặc en
language: vi

# ── Debug ────────────────────────────────────────────────────
debug: false

# Cắt các loại cỏ/dương xỉ bằng flint có cơ hội nhận dây đay.
# Cây cao có tỷ lệ tốt hơn và có thể rơi 2 dây.
jute:
  drops:
    SHORT_GRASS:
      chance: 0.18
      min-amount: 1
      max-amount: 1
    FERN:
      chance: 0.20
      min-amount: 1
      max-amount: 1
    TALL_GRASS:
      chance: 0.30
      min-amount: 1
      max-amount: 2
    LARGE_FERN:
      chance: 0.32
      min-amount: 1
      max-amount: 2

# Một khúc gỗ được bọc mud ở 4 mặt ngang và mặt đáy sẽ thành khối than gỗ.
charcoal-kiln:
  # Phải giữ chuột phải liên tục; giá trị thực tế được giới hạn trong khoảng 3-5 giây.
  ignition-seconds: 4.0
  duration-seconds: 120

# ── Tick Engine ───────────────────────────────────────────────
# Máy chạy mỗi bao nhiêu ticks (20 ticks = 1 giây)
tick-rate: 20

# ── Máy (Machine) ────────────────────────────────────────────
machines:
  # Khoảng cách tối đa để player mở GUI máy (blocks)
  interaction-range: 5
  # Hệ số nhân tốc độ tiến trình nấu recipe (0.8 = chậm hơn 20%, 1.0 = tốc độ gốc)
  time-speed-multiplier: 0.8

# ── GUI ───────────────────────────────────────────────────────
gui:
  # Tên hiển thị của inventory GUI (hỗ trợ & color codes)
  forge-title: "&8⚒ &6Ancient Forge"
  forge-custom:
    enabled: true
    prefix: "\uE100"
    glyph: "\uE150"
    font: "haohan:gui"
  # Slot layout: xem GuiManager hoặc ForgeGui để biết ý nghĩa từng slot
  fuel-slot: 3          # Ô nhiên liệu 1
  fuel-slot-2: 2        # Ô nhiên liệu 2 (mới)
  input-slot-1: 11      # Ô nguyên liệu 1
  input-slot-2: 12      # Ô nguyên liệu 2
  additive-slot: 10     # Ô phụ phẩm / chất trợ dung (mới)
  output-slot: 16       # Ô thành phẩm kim loại sạch
  slag-slot: 15         # Ô sỉ kim loại (slag)
  progress-slot: 13
  temperature-slot: 4


# Ngoài fuel vanilla, lò nhận thêm thực vật tươi, len/bed và vật phẩm lửa Nether.
# Các mục dưới đây override thời gian cháy; fuel không phân nhóm dùng fuel-defaults.
fuel-defaults:
  burn-ticks: 200
  temperature-limit: 300

fuel-groups:
  fresh-plant:
    burn-ticks: 3600       # ~3 phút
    temperature-limit: 150
  wool:
    burn-ticks: 200        # ~10 giây
    temperature-limit: 200
  wood:
    burn-ticks: 600        # ~30 giây
    temperature-limit: 400
  carbon:
    burn-ticks: 1500       # ~75 giây
    temperature-limit: 800
  lava:
    burn-ticks: 20000      # ~1000 giây
    temperature-limit: 1100
  nether-fire:
    burn-ticks: 300
    temperature-limit: 1450

# ── Fuel values (ticks mỗi đơn vị nhiên liệu) ─────────────────
fuel-values:
  COAL_BLOCK: 12000
  MAGMA_BLOCK: 600
  FIRE_CHARGE: 100
  BLAZE_POWDER: 200
  BLAZE_ROD: 400
  LAVA_BUCKET: 20000

temperature:
  # Nhiệt độ tăng bao nhiêu mỗi tick khi có fuel (8 = ~160°C/giây → đạt 800°C trong ~5 giây)
  rise-per-tick: 8
  # Nhiệt độ giảm bao nhiêu mỗi tick khi hết fuel
  fall-per-tick: 1
  # Nhiệt độ tối đa (°C)
  max: 2100
  # Manual bellows: heat added by one interaction.
  bellows-boost: 40
  # Piston bellows: heat and recipe ticks added by one piston stroke.
  piston-bellows-boost: 30
  piston-progress-ticks: 5
  # Tổ hợp không khai báo riêng nhận thêm một lượng nhiệt nhỏ từ buồng đốt thứ hai.
  combination-bonus: 75

  # Cấp độ giới hạn nhiệt độ tối đa theo loại nhiên liệu sử dụng
  fuel-limits:
    "COAL_BLOCK": 900
    "MAGMA_BLOCK": 1300
    "FIRE_CHARGE": 1400
    "BLAZE_POWDER": 1500
    "BLAZE_ROD": 1600
    "LAVA_BUCKET": 1100

  # Xung nhiệt ngay khi vật phẩm lửa Nether được tiêu hao.
  ignition-boosts:
    "MAGMA_BLOCK": 300
    "FIRE_CHARGE": 700
    "BLAZE_POWDER": 800
    "BLAZE_ROD": 900

  # Tổ hợp các nhiên liệu đốt cùng lúc tạo dải nhiệt độ trần khác nhau
  # Format: "FUEL_A+FUEL_B": limit
  # Thứ tự sắp xếp alphabetically. Ví dụ COAL+CHARCOAL thay vì CHARCOAL+COAL.
  fuel-combinations:
    "CHARCOAL+CHARCOAL": 950
    "COAL+CHARCOAL": 975
    "COAL+COAL": 1000
    "COAL_BLOCK+COAL_BLOCK": 1100
    "COAL+BLAZE_POWDER": 1300
    "COAL+BLAZE_ROD": 1400
    "MAGMA_BLOCK+BLAZE_ROD": 1700
    "BLAZE_POWDER+BLAZE_ROD": 1750
    "LAVA_BUCKET+BLAZE_ROD": 1800
    "BLAZE_ROD+BLAZE_ROD": 2050

  # Các chất làm mát chủ động và nhiệt độ hạ đi tương ứng
  coolants:
    "SNOWBALL": 50
    "ICE": 150
    "PACKED_ICE": 200
    "BLUE_ICE": 300
    "WATER_BUCKET": 400

# ── Phụ phẩm / Chất trợ dung (Additives / Flux) ───────────────
additives:
  # Chỉ Borax Powder (custom item borax_powder) mới được nhận là flux.
  borax-per-batch: 1
  # Có bột Borax: 98% kim loại sạch, 2% sỉ.
  clean-output-chance-with-borax: 0.98
  # Không có flux: 35% kim loại sạch, 65% sỉ.
  clean-output-chance-without-borax: 0.35

# Furnace và Blast Furnace vanilla không có ô flux. Chúng nung chậm
# như cấu hình hiện tại và có 25% cơ hội cho kim loại sạch.
vanilla-furnaces:
  clean-output-chance: 0.25


# ── Progression ───────────────────────────────────────────────
progression:
  # Hiện Action Bar/chat khi cúp không đủ cấp. Creative luôn bỏ qua cảnh báo này.
  show-mining-warnings: true
  # Độ cứng mô phỏng của quặng custom dùng NoteBlock state dành riêng.
  # Cúp và Efficiency hoạt động như quặng đá; rìu không còn được bonus tốc độ gỗ.
  # Mithril mặc định chậm hơn Obsidian (hardness 50).
  custom-ore-hardness:
    borax: 3.0
    deepslate-borax: 4.5
    mithril: 55.0
    deepslate-mithril: 65.0
  # Chuỗi cúp: Iron < EmberSteel < Diamond < Mithril < SoulSteel < Netherite.
  # 1: Wooden, 2: Stone/Gold, 3: Copper, 4: Iron, 5: EmberSteel,
  # 6: Diamond, 7: Mithril, 8: SoulSteel, 9: Netherite.
  mining-requirements:
    "minecraft:stone": 1
    "minecraft:coal_ore": 3
    "minecraft:deepslate_coal_ore": 3
    "minecraft:copper_ore": 2
    "minecraft:deepslate_copper_ore": 2
    "minecraft:raw_copper_block": 2
    "minecraft:iron_ore": 2
    "minecraft:deepslate_iron_ore": 2
    "minecraft:raw_iron_block": 2
    "minecraft:diamond_ore": 5
    "minecraft:deepslate_diamond_ore": 5
    "minecraft:lapis_ore": 3
    "minecraft:deepslate_lapis_ore": 3
    "minecraft:obsidian": 7
    "minecraft:crying_obsidian": 7
    "minecraft:ancient_debris": 8
    "minecraft:netherite_block": 8
  # Tier cua tool vanilla. Plugin dung bang nay de kiem tra progression dao quang.
  vanilla-tool-tiers:
    WOODEN_PICKAXE: 1
    STONE_PICKAXE: 2
    GOLDEN_PICKAXE: 2
    COPPER_PICKAXE: 3
    IRON_PICKAXE: 4
    DIAMOND_PICKAXE: 6
    NETHERITE_PICKAXE: 9

  # Thong so cho item plugin. Item van co the dung texture/model vanilla,
  # nhung tier, durability va attribute duoc gan khi plugin tao item.
  custom-item-stats:
    bow_drill:
      tier: 0
      max-damage: 5
      attack-damage: 0.0
      attack-speed: 0.0
      mining-efficiency: 0.0
      block-break-speed: 0.0
    copper_slag_pickaxe:
      tier: 3
      max-damage: 95
      attack-damage: 2.0
      attack-speed: -2.8
      mining-efficiency: 1.5
      block-break-speed: 0.0
    iron_slag_pickaxe:
      tier: 3
      max-damage: 190
      attack-damage: 3.0
      attack-speed: -2.8
      mining-efficiency: 3.5
      block-break-speed: 0.0
    gold_slag_pickaxe:
      tier: 1
      max-damage: 24
      attack-damage: 1.0
      attack-speed: -2.8
      mining-efficiency: 8.0
      block-break-speed: 0.0
    embersteel_slag_pickaxe:
      tier: 4
      max-damage: 120
      attack-damage: 2.0
      attack-speed: -2.8
      mining-efficiency: 2.0
      block-break-speed: 0.0
    embersteel_pickaxe:
      tier: 5
      max-damage: 210
      attack-damage: 3.0
      attack-speed: -2.8
      mining-efficiency: 3.0
      block-break-speed: 0.0
    soulsteel_slag_pickaxe:
      tier: 7
      max-damage: 1200
      attack-damage: 3.0
      attack-speed: -2.8
      mining-efficiency: 7.0
      block-break-speed: 0.0
    soulsteel_pickaxe:
      tier: 8
      max-damage: 2200
      attack-damage: 4.0
      attack-speed: -2.8
      mining-efficiency: 9.5
      block-break-speed: 0.0
    netherite_slag_pickaxe:
      tier: 8
      max-damage: 1500
      attack-damage: 3.0
      attack-speed: -2.8
      mining-efficiency: 7.5
      block-break-speed: 0.0
    mithril_pickaxe:
      tier: 7
      max-damage: 1800
      attack-damage: 4.0
      attack-speed: -2.8
      mining-efficiency: 8.5
      block-break-speed: 0.0
    mithril_slag_pickaxe:
      tier: 6
      max-damage: 900
      attack-damage: 3.0
      attack-speed: -2.8
      mining-efficiency: 6.0
      block-break-speed: 0.0

# ── Fail rate (Phase 5 — để trống ở Phase 1) ─────────────────
fail:
  enabled: true
  base-chance: 0.1   # 10% fail mặc định


# ── Mô hình 3D lò rèn (Phase 5.5) ──────────────────────────────
forge-model:
  enabled: true
  material: "PAPER"
  # Minecraft 1.21.4+: dùng item_model component để trỏ thẳng tới
  # HaoHanMetallurgy_Resourcepack/assets/minecraft/items/metallurgy.json
  item-model: "haohan:metallurgy"
  # Fallback/debug cho resource pack kiểu cũ.
  custom-model-data: 10001
  # Bạn có thể tăng giảm scale ở đây nếu model hiển thị quá to/nhỏ trong game
  scale:
    x: 3.0
    y: 4.0
    z: 3.0
  # Điều chỉnh vị trí tương đối của mô hình 3D để nó khớp chính xác với tâm của lò rèn
  offset:
    x: 0.5
    y: 0.5    # Đặt đáy model ngang mặt block
    z: 0.5
  # Khoảng cách tối đa client render model 3D (block). Entity vẫn tồn tại.
  view-range: 64.0
